<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dear Beauty – lämna ett omdöme på Google</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&family=Gelasio:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #E6DCCF; --ink: #2B1B06; --soft: #5C4A36; --gold: #2B1B06; --line: #CDBFAE;
    --stage: #D6CABB;
    --xo-black: #1A1A1A; --petal: #FFE8F2; --wow: #FF2D7B;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #1C1712; } }
  :root[data-theme="dark"] { --stage: #1C1712; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; height: 100%; background: var(--stage); font-family: Jost, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; }

  .phone { width: 390px; height: 780px; max-height: calc(100% - 32px); border-radius: 48px; overflow: hidden; position: relative;
    background: var(--ivory); color: var(--ink); box-shadow: 0 0 0 12px #161210, 0 40px 80px -30px rgba(0,0,0,.45); }
  @media (max-width: 500px) { .phone { width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; } }

  .screen { height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 70px 30px 28px; }
  .logo { width: 270px; max-width: 78%; height: auto; display: block; }
  .rule { width: 48px; height: 1px; background: var(--gold); border: 0; margin: 30px 0 0; }
  .welcome { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500; font-size: 32px; line-height: 1.15; margin: 24px 0 0; }
  .ask { font-size: 16px; line-height: 1.55; color: var(--soft); margin: 14px 0 0; max-width: 290px; }

  .middle { margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .stars { display: flex; gap: 8px; }
  .stars svg { width: 28px; height: 28px; fill: var(--gold); opacity: .22; transform: scale(.85); transition: opacity .25s, transform .25s; }
  .stars svg.lit { opacity: 1; transform: scale(1); }
  .status { font-size: 13px; letter-spacing: 2.2px; text-transform: uppercase; font-weight: 500; margin: 0; min-height: 20px; }
  .bar { width: 66%; height: 2px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--ink); }
  .bar.go span { width: 100%; transition: width 1.8s linear; }
  .btn { margin-top: 6px; display: inline-block; text-decoration: none; background: var(--ink); color: var(--ivory);
    font: 500 14px Jost, Arial, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; padding: 17px 30px; border-radius: 2px; }
  .hint { font-size: 13px; color: var(--soft); margin: 0; }

  .sign { margin-top: 30px; display: inline-flex; align-items: baseline; gap: 7px; white-space: nowrap; background: var(--xo-black);
    border-radius: 999px; padding: 9px 18px; }
  .sign .by { font-family: "DM Sans", Jost, Arial, sans-serif; font-size: 12px; color: var(--petal); }
  .sign .m { font-family: Gelasio, Georgia, serif; font-size: 15px; font-weight: 700; color: var(--petal); }
  .sign em { color: var(--wow); }

  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .bar.go span, .stars svg { transition: none; } }
</style>
</head>
